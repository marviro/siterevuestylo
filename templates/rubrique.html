<html>

<head>
	<link rel="stylesheet" href="../static/css/cookieconsent.css">
	<script src="https://zeffy-scripts.s3.ca-central-1.amazonaws.com/embed-form-script.min.js"></script>
	<link href="../static/css/style.css" rel="stylesheet">
	<link rel="preconnect" href="https://rsms.me/">
	<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
	<title>{{title|striptags}}</title>
	<link rel="icon" type="image/png" href="../static/media/favicon.png">
    <meta property="og:image" content="https://lampadaire.ca/static/media/lockup_lampadaire.jpg">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
	<meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
	
	<div class="corps">
		{% include "header.html" %}
		<h1>{{mykeyword['name'] | capitalize}}</h1>
		<!-- Liste articles: -->
		<table class="display-articles">
            {% for a in mykeyword['articles'] | sort(attribute="title")%}
            <tr>
               	<td>No. {{a['myid'][0:2]}}</td>
                <td><div style="width: 66.6%">{%if a['myid'] != ''%}<a href="../articles/{{a['myid']}}.html">{{a['title'] | striptags}}</a><br>{%endif%}</div></td>
                <td>{{a['authors'] | safe }}</td>
                <td></td>
                <td>{{a['date']}}</td>
            </tr>
            {%endfor%}
        </table>
	</div>
	{% include "footer.html" %}
</body>

</html>
